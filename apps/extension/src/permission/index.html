<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BestQ — Microphone Access</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #020617;
        color: #e2e8f0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        width: 100%;
        max-width: 440px;
        background: #0b1220;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 20px;
        padding: 32px;
        text-align: center;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      }
      .icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        border-radius: 18px;
        background: linear-gradient(135deg, #8b5cf6, #7c3aed);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      h1 {
        font-size: 19px;
        font-weight: 700;
        color: #fff;
        margin-bottom: 8px;
      }
      p {
        font-size: 14px;
        line-height: 1.55;
        color: #94a3b8;
      }
      .status {
        margin-top: 20px;
        font-size: 13px;
        font-weight: 600;
        min-height: 20px;
      }
      .status.ok {
        color: #34d399;
      }
      .status.err {
        color: #f87171;
      }
      .hint {
        margin-top: 14px;
        font-size: 12px;
        color: #64748b;
        line-height: 1.5;
      }
      button {
        margin-top: 22px;
        width: 100%;
        height: 44px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(90deg, #8b5cf6, #7c3aed);
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.15s ease;
      }
      button:hover {
        opacity: 0.9;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z" />
          <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
          <line x1="12" y1="19" x2="12" y2="22" />
        </svg>
      </div>
      <h1>Enable your microphone</h1>
      <p>
        BestQ needs permission to use your microphone so your voice is recorded together with
        your screen. Click <strong>Allow</strong> in the browser prompt.
      </p>
      <div id="status" class="status"></div>
      <div id="hint" class="hint"></div>
      <button id="retry" type="button">Request microphone access</button>
    </div>
    <script type="module" src="./index.ts"></script>
  </body>
</html>

version: '3.9'

x-backend-env: &backend-env
  env_file:
    - .env
  environment:
    NODE_ENV: ${NODE_ENV:-development}
    DATABASE_URL: postgresql://${POSTGRES_USER:-jam}:${POSTGRES_PASSWORD:-jampassword}@postgres:5432/${POSTGRES_DB:-jamdb}
    REDIS_URL: redis://redis:6379
    PORT: 5000
    JWT_SECRET: ${JWT_SECRET}
    JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
    CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
    CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
    CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
    CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
    MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-500}

services:
  # ─────────────────────────────────────────────
  # PostgreSQL Database
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: jam_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jamdb}
      POSTGRES_USER: ${POSTGRES_USER:-jam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jampassword}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-jam} -d ${POSTGRES_DB:-jamdb}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - jam_network

  # ─────────────────────────────────────────────
  # Redis Cache / Queue
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: jam_redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-redis-password}
    volumes:
      - redis_data:/data
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-redis-password}', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - jam_network

  # ─────────────────────────────────────────────
  # Backend API Server
  # ─────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: ${BUILD_TARGET:-production}
      args:
        - NODE_ENV=${NODE_ENV:-production}
    container_name: jam_backend
    restart: unless-stopped
    <<: *backend-env
    ports:
      - '${BACKEND_PORT:-5000}:5000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Development hot-reload mounts (only active in dev target)
      - ./apps/backend/src:/app/apps/backend/src:ro
      - ./apps/backend/prisma:/app/apps/backend/prisma:ro
      # Shared upload temp directory
      - uploads_tmp:/app/uploads
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:5000/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - jam_network
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  # ─────────────────────────────────────────────
  # Background Worker (video processing, FFmpeg)
  # ─────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
      target: ${BUILD_TARGET:-production}
    container_name: jam_worker
    restart: unless-stopped
    <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - uploads_tmp:/app/uploads
    networks:
      - jam_network
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  # ─────────────────────────────────────────────
  # Dashboard (React SPA)
  # ─────────────────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: docker/dashboard.Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost/api}
        - VITE_WS_URL=${VITE_WS_URL:-ws://localhost}
    container_name: jam_dashboard
    restart: unless-stopped
    ports:
      - '${DASHBOARD_PORT:-3001}:80'
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - jam_network
    logging:
      driver: 'json-file'
      options:
        max-size: '5m'
        max-file: '3'

  # ─────────────────────────────────────────────
  # Nginx Reverse Proxy
  # ─────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: jam_nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      backend:
        condition: service_healthy
      dashboard:
        condition: service_started
    networks:
      - jam_network
    healthcheck:
      test: ['CMD-SHELL', 'nginx -t && wget -qO- http://localhost/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '5'

# ─────────────────────────────────────────────
# Networks
# ─────────────────────────────────────────────
networks:
  jam_network:
    driver: bridge
    name: jam_network

# ─────────────────────────────────────────────
# Named Volumes
# ─────────────────────────────────────────────
volumes:
  postgres_data:
    name: jam_postgres_data
  redis_data:
    name: jam_redis_data
  uploads_tmp:
    name: jam_uploads_tmp
  nginx_logs:
    name: jam_nginx_logs

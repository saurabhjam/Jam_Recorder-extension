version: '3.9'

x-backend-env: &backend-env
  env_file:
    - .env
  environment:
    NODE_ENV: ${NODE_ENV:-development}
    DATABASE_URL: postgresql://rpuser:rppass@192.168.30.184:5432/reportportal
    PORT: 5000
    JWT_SECRET: ${JWT_SECRET}
    JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
    CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
    MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-500}

services:
  # ─────────────────────────────────────────────
  # PostgreSQL Database
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: jam_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jamdb}
      POSTGRES_USER: ${POSTGRES_USER:-jam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jampassword}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-jam} -d ${POSTGRES_DB:-jamdb}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - jam_network

  # ─────────────────────────────────────────────
  # Backend API Server
  # ─────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: ${BUILD_TARGET:-production}
      args:
        - NODE_ENV=${NODE_ENV:-production}
    container_name: jam_backend
    restart: unless-stopped
    <<: *backend-env
    ports:
      - '${BACKEND_PORT:-5000}:5000'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Development hot-reload mounts (only active in dev target)
      - ./apps/backend/src:/app/apps/backend/src:ro
      - ./apps/backend/prisma:/app/apps/backend/prisma:ro
      # Shared upload temp directory
      - uploads_tmp:/app/uploads
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:5000/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - jam_network
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  # ─────────────────────────────────────────────
  # Nginx Reverse Proxy
  # ─────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: jam_nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - jam_network
    healthcheck:
      test: ['CMD-SHELL', 'nginx -t && wget -qO- http://localhost/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '5'

# ─────────────────────────────────────────────
# Networks
# ─────────────────────────────────────────────
networks:
  jam_network:
    driver: bridge
    name: jam_network

# ─────────────────────────────────────────────
# Named Volumes
# ─────────────────────────────────────────────
volumes:
  postgres_data:
    name: jam_postgres_data
  uploads_tmp:
    name: jam_uploads_tmp
  nginx_logs:
    name: jam_nginx_logs

# ─────────────────────────────────────────────
# Jam Recorder – Main Nginx Reverse Proxy
# ─────────────────────────────────────────────
# Handles:
#   /api/*       → backend:5000  (REST API)
#   /socket.io/* → backend:5000  (WebSocket)
#   /            → dashboard:80  (React SPA)
#
# SSL is configured below (commented out).
# Uncomment and replace certs to enable HTTPS.
# ─────────────────────────────────────────────

# ── Upstream definitions ──────────────────────
upstream backend {
    server backend:5000;
    keepalive 32;
}

upstream dashboard {
    server dashboard:80;
    keepalive 16;
}

# ── Rate limiting zones ───────────────────────
# Limit API requests: 30 req/s per IP
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
# Limit upload requests: 5 req/s per IP
limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=5r/s;

# ── HTTP → HTTPS redirect (uncomment for SSL) ─
# server {
#     listen 80;
#     listen [::]:80;
#     server_name your-domain.com www.your-domain.com;
#
#     # Allow Let's Encrypt ACME challenge
#     location /.well-known/acme-challenge/ {
#         root /var/www/certbot;
#     }
#
#     location / {
#         return 301 https://$host$request_uri;
#     }
# }

# ── HTTP server (primary for local dev + staging) ─
server {
    listen 80;
    listen [::]:80;
    server_name localhost _;

    # ── Global settings ───────────────────────
    client_max_body_size 500M;
    client_body_timeout  300s;
    send_timeout         300s;

    # ── Security headers ──────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Logging ───────────────────────────────
    access_log /var/log/nginx/access.log combined;
    error_log  /var/log/nginx/error.log warn;

    # ── Gzip ─────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json
        application/xml image/svg+xml;

    # ── Health check (nginx itself) ───────────
    location = /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ────────────────────────────────────────────
    # API routes → backend
    # ────────────────────────────────────────────
    location /api/ {
        # Rate limiting: burst of 60, no delay
        limit_req zone=api_limit burst=60 nodelay;
        limit_req_status 429;

        proxy_pass         http://backend;
        proxy_http_version 1.1;

        # Required for WebSocket upgrade negotiation
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        # Standard proxy headers
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Forwarded-Port  $server_port;

        # Timeout settings for long-running requests (uploads, processing)
        proxy_connect_timeout  60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # Buffer settings for large request bodies (video uploads)
        proxy_request_buffering   off;
        proxy_buffering           off;
        proxy_buffer_size         16k;
        proxy_buffers             8 16k;

        # Pass error responses from backend
        proxy_intercept_errors off;
    }

    # ── Upload endpoint – separate rate limit ──
    location /api/recordings/upload {
        limit_req zone=upload_limit burst=10 nodelay;
        limit_req_status 429;

        proxy_pass         http://backend;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Large body + long timeout for video uploads
        client_max_body_size 500M;
        proxy_read_timeout   600s;
        proxy_send_timeout   600s;
        proxy_request_buffering off;
    }

    # ────────────────────────────────────────────
    # Socket.IO (WebSocket) → backend
    # ────────────────────────────────────────────
    location /socket.io/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;

        # WebSocket upgrade headers
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Long timeout for persistent WebSocket connections
        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
        proxy_connect_timeout 60s;

        # Disable buffering for real-time events
        proxy_buffering off;
    }

    # ────────────────────────────────────────────
    # Dashboard (React SPA) → dashboard container
    # ────────────────────────────────────────────
    location / {
        proxy_pass         http://dashboard;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_read_timeout    30s;

        # Dashboard is pre-gzipped by its own nginx
        proxy_set_header   Accept-Encoding "";
    }

    # ── Deny hidden files ─────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}


# ─────────────────────────────────────────────
# Nginx configuration for React SPA (Dashboard)
# Served as a static container on port 80
# ─────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Character encoding ────────────────────
    charset utf-8;

    # ── Compression ───────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/woff
        font/woff2
        application/font-woff
        application/font-woff2;

    # ── Security headers ──────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Health check endpoint ─────────────────
    location = /health.html {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "OK";
    }

    # ── Hashed static assets (long-lived cache) ─
    # Vite produces assets with content-hash filenames in assets/
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        access_log off;
        try_files $uri =404;
    }

    # ── Fonts (long-lived cache) ──────────────
    location ~* \.(woff|woff2|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        access_log off;
    }

    # ── Images / Media ────────────────────────
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    # ── index.html – never cache ──────────────
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
    }

    # ── React SPA catch-all (client-side routing) ─
    location / {
        try_files $uri $uri/ /index.html;

        # index.html should never be cached by browsers
        location = /index.html {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }

    # ── Deny hidden files ─────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── Logging ───────────────────────────────
    access_log /var/log/nginx/dashboard.access.log combined;
    error_log  /var/log/nginx/dashboard.error.log warn;
}
